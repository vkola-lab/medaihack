<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AmyloidPET Regression Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-white font-sans h-screen flex flex-col">

    <header class="p-4 bg-[#1e293b] border-b border-gray-700 flex justify-between items-center shadow-lg">
        <h1 class="text-xl font-bold text-blue-400">PET Subject Dashboard</h1>
        <input type="file" id="file-input" class="hidden" accept=".npy">
        <button onclick="document.getElementById('file-input').click()" class="bg-blue-600 px-5 py-2 rounded-lg font-semibold hover:bg-blue-500 transition">
            Upload PET Scan (.npy)
        </button>
    </header>

    <main class="flex-1 flex overflow-hidden p-4 gap-4">
        
        <section class="w-1/3 bg-[#1e293b] rounded-xl border border-gray-700 p-2 grid grid-cols-2 grid-rows-2 gap-2 shadow-inner min-h-[400px] h-full">
    
            <div class="relative bg-black rounded-lg overflow-hidden border border-gray-700 shadow">
                <div class="absolute top-2 left-2 z-10 text-[10px] font-bold text-gray-300 bg-gray-900/80 px-2 py-1 rounded uppercase tracking-wider border border-gray-600">Coronal</div>
                <canvas id="coronal-canvas" class="absolute inset-0 w-full h-full"></canvas>
            </div>
            
            <div class="relative bg-black rounded-lg overflow-hidden border border-gray-700 shadow">
                <div class="absolute top-2 left-2 z-10 text-[10px] font-bold text-gray-300 bg-gray-900/80 px-2 py-1 rounded uppercase tracking-wider border border-gray-600">Sagittal</div>
                <canvas id="sagittal-canvas" class="absolute inset-0 w-full h-full"></canvas>
            </div>

            <div class="col-span-2 relative bg-black rounded-lg overflow-hidden border border-gray-700 shadow">
                <div class="absolute top-2 left-2 z-10 text-[10px] font-bold text-gray-300 bg-gray-900/80 px-2 py-1 rounded uppercase tracking-wider border border-gray-600">Axial</div>
                <canvas id="axial-canvas" class="absolute inset-0 w-full h-full"></canvas>
            </div>

        </section>

        <section class="w-1/3 bg-black rounded-xl border border-gray-700 relative overflow-hidden shadow-inner">
            <div class="absolute top-2 left-2 z-10 text-xs font-bold text-gray-400">3D Render</div>
            <canvas id="render-canvas" class="w-full h-full"></canvas>
        </section>

        <section class="w-1/3 flex flex-col gap-4">
    
            <div class="bg-[#1e293b] p-4 rounded-xl border border-gray-700 shadow-lg grid grid-cols-3 gap-2 text-center">
                <div>
                    <div class="text-[10px] text-gray-500 font-bold uppercase tracking-wider">Subject ID</div>
                    <div class="text-white font-bold text-lg truncate" id="meta-subject">--</div>
                </div>
                <div class="border-l border-gray-700">
                    <div class="text-[10px] text-gray-500 font-bold uppercase tracking-wider">Tracer</div>
                    <div class="text-blue-400 font-bold text-lg" id="meta-tracer">--</div>
                </div>
                <div class="border-l border-gray-700">
                    <div class="text-[10px] text-gray-500 font-bold uppercase tracking-wider">Tracer Full Name</div>
                    <div class="text-gray-300 font-bold text-sm mt-1 truncate px-1" id="meta-full-tracer">--</div>
                </div>
            </div>

            <div class="bg-[#1e293b] p-6 rounded-xl border border-gray-700 shadow-lg flex justify-between items-center gap-4">
                
                <div>
                    <h2 class="text-gray-400 uppercase text-xs tracking-widest mb-2 font-bold">Predicted Centiloid Score</h2>
                    <div class="flex items-end gap-3">
                        <div id="prediction-val" class="text-4xl font-black text-white">--</div>
                        <div class="text-xl text-gray-500 mb-1 font-bold">CL</div>
                    </div>
                    <div id="status-badge" class="mt-4 inline-block px-3 py-1 rounded text-sm font-bold bg-gray-700 text-gray-300">
                        WAITING FOR DATA
                    </div>
                </div>
                
                <div class="text-right flex-1 border-l border-gray-700 pl-4">
                    <div class="text-[10px] text-gray-500 font-bold uppercase tracking-wider mb-2">Threshold Source</div>
                    <div id="threshold-cite" class="text-xs text-gray-400 italic">
                        Upload scan to view literature criteria.
                    </div>
                </div>
                
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="bg-[#1e293b] p-4 rounded-xl border border-gray-700 text-center shadow-lg">
                    <div class="text-blue-400 font-black text-2xl" id="r2-metric">N/A</div>
                    <div class="text-xs text-gray-500 font-bold uppercase tracking-wider mt-1">Benchmark R²</div>
                </div>
                <div class="bg-[#1e293b] p-4 rounded-xl border border-gray-700 text-center shadow-lg">
                    <div class="text-red-400 font-black text-2xl" id="rmse-metric">N/A</div>
                    <div class="text-xs text-gray-500 font-bold uppercase tracking-wider mt-1">Avg. MSE</div>
                </div>
            </div>
            
            <div class="bg-[#1e293b] p-5 rounded-xl border border-gray-700 shadow-lg flex-1 flex flex-col">
                <h3 class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-4 border-b border-gray-700 pb-2">Backend Pipeline</h3>
                

            </div>
    
        </section>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
