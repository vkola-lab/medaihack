# Stage 3: PETResNet-NoFiLM + stage-4 spatial attention (CBAM-style).
#
# Base: petresnet_no_film (current best, ~2 CL better val MAE).
#       TracerNorm is TRAINED here (not frozen) — the "no-FiLM but keep
#       per-tracer intensity normalization" setup.
# Add : SpatialAttention3D on stage-4 output only (learnable continuous
#       analog of the Klunk CTX VOI). ~686 params for 7³ kernel.
#
# Launch:
#     python dev/train.py --config ablations/configs/stage3_attn.yaml
#     bash   dev/train.sh ablations/configs/stage3_attn.yaml

paths:
  train_csv: data/train.csv
  val_csv:   data/val.csv
  log_dir:   logs
  checkpoint_dir: checkpoints/stage3_attn

run:
  name: stage3_attn
  seed: 42

model:
  name: petresnet_attn
  emb_dim:      32            # unused by petresnet_attn; kept for schema compat
  dropout_high: 0.4
  dropout_low:  0.2
  freeze_tracer_norm: false   # TracerNorm trained — this is the "keep TN" arm
  use_spatial_attention: true
  attention_kernel: 7

training:
  epochs:       100
  batch_size:   4
  num_workers:  4
  lr:           1.0e-4
  weight_decay: 1.0e-4
  clip_grad:    1.0
  patience:     20

augmentation:
  enabled:    true
  per_tracer: true            # STRONG for NAV/PIB when true

loss:
  name:  centiloid            # centiloid | huber | mse | mae
  delta: 25.0                 # Huber threshold (≈ IQR of CL)
  alpha: 0.7                  # mix: α·Huber + (1−α)·(1 − Pearson r)
