# Stage 3 v2: PETResNet-NoFiLM + residual spatial attention (zero-init).
#
# Fixes vs stage3_attn:
#   - SpatialAttention3DGated returns x * (1 + attn), not x * attn
#     → attention enhances rather than suppresses (multiplier ∈ [1, 2])
#   - Conv weights zero-initialized
#     → sigmoid(0) = 0.5 uniform at step 0 → module starts as 1.5·x scalar
#       (absorbed by downstream BN) → effective identity
#   Hypothesis: epoch-1 Pearson r recovers toward baseline (~0.75+) and
#   late-training instability (oscillation after ep 55 in stage3_attn) fades.
#
# Launch:
#     python dev/train.py --config ablations/configs/stage3_attn_gated.yaml
#     bash   dev/train.sh ablations/configs/stage3_attn_gated.yaml

paths:
  train_csv: data/train.csv
  val_csv:   data/val.csv
  log_dir:   logs
  checkpoint_dir: checkpoints/stage3_attn_gated

run:
  name: stage3_attn_gated
  seed: 42

model:
  name: petresnet_attn_gated
  emb_dim:      32            # unused; kept for schema compat
  dropout_high: 0.4
  dropout_low:  0.2
  freeze_tracer_norm: false   # TracerNorm trained (same as stage3_attn)
  use_spatial_attention: true
  attention_kernel: 7

training:
  epochs:       100
  batch_size:   4
  num_workers:  4
  lr:           1.0e-4
  weight_decay: 1.0e-4
  clip_grad:    1.0
  patience:     20

augmentation:
  enabled:    true
  per_tracer: true

loss:
  name:  centiloid
  delta: 25.0
  alpha: 0.7
