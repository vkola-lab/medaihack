# TracerNorm ABLATION — trains with tracer_norm frozen at identity
# (γ=1, β=0, not updated by the optimizer). Use this to measure TracerNorm's
# real contribution: compare best val MAE to a baseline run from train.yaml.
#
# Launch:
#     bash dev/train.sh ablations/configs/train_no_tracernorm.yaml

paths:
  train_csv: data/train.csv
  val_csv:   data/val.csv
  log_dir:   logs
  checkpoint_dir: null        # null  → <run_dir>/checkpoints

run:
  name: ablation_no_tracernorm   # tag the run folder so it's easy to find
  seed: 42

model:
  name: petresnet_no_film     # petresnet | petresnet_no_film
  emb_dim:      32
  dropout_high: 0.4
  dropout_low:  0.2
  freeze_tracer_norm: true    # ← the ablation: γ=1, β=0, not trained

training:
  epochs:       100
  batch_size:   4
  num_workers:  4
  lr:           1.0e-4
  weight_decay: 1.0e-4
  clip_grad:    1.0
  patience:     20

augmentation:
  enabled:    true
  per_tracer: true            # STRONG for NAV/PIB when true

loss:
  name:  centiloid            # centiloid | huber | mse | mae
  delta: 25.0                 # Huber threshold (≈ IQR of CL)
  alpha: 0.7                  # mix: α·Huber + (1−α)·(1 − Pearson r)
