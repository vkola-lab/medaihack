# TracerNorm-only ablation — report §3.5 Table 2, §4.3 Table 4 (MAE 9.03 CL).
#
# Variant: TracerNorm kept; FiLM blocks removed; tracer-embedding GAP concat
#          removed. Tracer identity reaches the network exclusively through
#          the input-space (γ_t, β_t) in TracerNorm.
#
# Launch:
#     bash dev/train.sh ablations/configs/tracer_norm_only.yaml

paths:
  train_csv: data/train.csv
  val_csv:   data/val.csv
  log_dir:   logs
  checkpoint_dir: null        # null  → <run_dir>/checkpoints

run:
  name: ablation_tracer_norm_only
  seed: 42

model:
  name: petresnet_tracer_norm_only
  emb_dim:      32            # unused by this variant; kept for schema compat
  dropout_high: 0.4
  dropout_low:  0.2
  freeze_tracer_norm: false   # TracerNorm is trained — the point of this arm

training:
  epochs:       100
  batch_size:   4
  num_workers:  4
  lr:           1.0e-4
  weight_decay: 1.0e-4
  clip_grad:    1.0
  patience:     20

augmentation:
  enabled:    true
  per_tracer: true            # STRONG for NAV/PIB when true

loss:
  name:  centiloid            # centiloid | huber | mse | mae
  delta: 25.0                 # Huber threshold (≈ IQR of CL)
  alpha: 0.7                  # mix: α·Huber + (1−α)·(1 − Pearson r)
